# Every pull request and master: `just check` (format, lints, buf lint, unit and integration tests) and the
# release build. The ruleset on master requires this check, so nothing merges
# without it.
name: gate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push supersedes the run still going on the same ref.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml is the one source of the version and components.
      - name: Toolchain
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # just lands in ~/.local/bin, no sudo. Same artefact and sha256 as the
      # dev.Dockerfile's.
      - name: Install just
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          curl -fsSLo "$RUNNER_TEMP/just.tgz" \
            https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-x86_64-unknown-linux-musl.tar.gz
          echo "409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e  $RUNNER_TEMP/just.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/just.tgz" -C ~/.local/bin --no-same-owner just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # buf and the plugins that write the Rust code of the contract. Same
      # artefacts and sha256 as the dev.Dockerfile's.
      - name: Install buf and its plugins
        run: |
          set -euo pipefail
          fetch() { curl -fsSLo "$RUNNER_TEMP/$3" "$2"; echo "$1  $RUNNER_TEMP/$3" | sha256sum -c -; }
          quick=https://github.com/cargo-bins/cargo-quickinstall/releases/download
          fetch 7168a06e29bd5eb8d1530848f242264f7a86b9b8af3b2e811570fbea0c929a30 \
            https://github.com/bufbuild/buf/releases/download/v1.75.0/buf-Linux-x86_64.tar.gz buf.tgz
          fetch 038a43ee2df38504bc28b9adc078733622be367af9f58dd874c7e4e02b2b8756 \
            $quick/protoc-gen-prost-0.5.0/protoc-gen-prost-0.5.0-x86_64-unknown-linux-musl.tar.gz protoc-gen-prost.tgz
          fetch 0eb4ce2f823371abfc82631b7e11ff8c93ca196453b9ec55256b51d2826decae \
            $quick/protoc-gen-prost-serde-0.4.0/protoc-gen-prost-serde-0.4.0-x86_64-unknown-linux-musl.tar.gz protoc-gen-prost-serde.tgz
          fetch 44dbd20acdb50454380918ab6de336dd1fc55e4f5e6788b8a886e598811fba4d \
            $quick/protoc-gen-tonic-0.5.0/protoc-gen-tonic-0.5.0-x86_64-unknown-linux-musl.tar.gz protoc-gen-tonic.tgz
          tar -xzf "$RUNNER_TEMP/buf.tgz" -C ~/.local --strip-components=1 --no-same-owner buf/bin
          for p in protoc-gen-prost protoc-gen-prost-serde protoc-gen-tonic; do
            tar -xzf "$RUNNER_TEMP/$p.tgz" -C ~/.local/bin --no-same-owner $p
          done
          buf --version

      # The same recipe a developer runs: format, clippy, buf lint, the unit
      # tests, the integration tests.
      - name: Check
        run: just check

      # The committed Rust code is what the .proto files generate, and a
      # dependency change came with its Cargo.lock.
      - name: Generated code and lockfile are current
        run: |
          set -euo pipefail
          just gen
          git diff --exit-code

      - name: Build
        run: just build
