[package]
name = "xosl-newsweb"
description = "Self-hosted mirror of Oslo Børs NewsWeb: company disclosures and their attachments, served over gRPC. Unofficial."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jan-blomquist/xosl-newsweb"
authors = ["Jan Blomquist"]
readme = "README.md"
# A service, released as a container image; nothing goes to crates.io.
publish = false

[dependencies]
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
bytes = "1.12.1"
jiff = { version = "1.0.0", features = ["tzdb-bundle-always"] }
pbjson = "0.9.0"
prost = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "http2", "rustls"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
