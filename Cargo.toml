[package]
name = "xosl-newsweb"
description = "Self-hosted mirror of Oslo Børs NewsWeb: company disclosures and their attachments, served over gRPC. Unofficial."
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jan-blomquist/xosl-newsweb"
authors = ["Jan Blomquist"]
readme = "README.md"
# A service, released as a container image; nothing goes to crates.io.
publish = false

[dependencies]
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
hmac = "0.13.0"
infer = "0.22.0"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
object_store = { version = "0.14.2", default-features = false, features = ["fs"] }
pbjson = "0.9.0"
prost = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "http2", "rustls"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
